name: Build FoodRanked Studio Windows

on:
  workflow_dispatch:
  push:
    tags:
      - "studio-windows-v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"

      - name: Install Playwright Chromium
        run: npx playwright install chromium
        env:
          PLAYWRIGHT_BROWSERS_PATH: "0"

      - name: Check Studio
        run: npm run studio:check

      - name: Build Windows zip
        run: npm run dist:win

      - name: Prepare release zip
        shell: pwsh
        run: |
          $zip = Get-ChildItem -Path "dist/desktop" -Filter "*-win.zip" | Select-Object -First 1
          if (-not $zip) { throw "No Windows zip found in dist/desktop" }
          Copy-Item $zip.FullName "dist/desktop/FoodRanked-Studio-Windows.zip" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoodRanked-Studio-Windows
          path: |
            dist/desktop/*.zip
            dist/desktop/*.blockmap
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/studio-windows-v')
        uses: softprops/action-gh-release@v2
        with:
          name: FoodRanked Studio Windows ${{ github.ref_name }}
          body: |
            Download `FoodRanked-Studio-Windows.zip`, unzip it, and run `FoodRanked Studio.exe`.
          files: dist/desktop/FoodRanked-Studio-Windows.zip
