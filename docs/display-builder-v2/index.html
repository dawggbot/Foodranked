<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>FoodRanked Display Builder v2</title>
  <link rel="stylesheet" href="./display-builder-v2.css?v=20260719-pros-cons-binding-v1" />
</head>
<body>
  <main class="app-shell">
    <aside class="sidebar stack">
      <section class="panel stack">
        <h2>Layout Selector</h2>
        <label class="field">
          <span>Layout</span>
          <select id="layoutSelect"></select>
        </label>
        <div id="layoutStatus" class="notice"></div>
      </section>

      <section class="panel stack">
        <h2>Foods Library</h2>
        <label class="field">
          <span>Search</span>
          <input id="foodSearch" type="search" autocomplete="off" placeholder="Search foods" />
        </label>
        <div id="foodList" class="food-list" role="listbox" aria-label="Foods"></div>
      </section>

      <section class="panel stack">
        <h2>Display Sections</h2>
        <div id="sectionList" class="section-list"></div>
      </section>
    </aside>

    <section class="stage-column stack">
      <section class="panel canvas-panel stack">
        <div class="canvas-heading">
          <div>
            <h2>Display Canvas</h2>
            <div id="canvasMeta" class="muted small">Read-only data-applied display</div>
          </div>
          <div id="foodTypePill" class="food-type-pill">ACTIVE FOOD TYPE: UNKNOWN</div>
        </div>
        <div class="canvas-wrap">
          <div id="displayCanvas" class="display-canvas" aria-label="Read-only FoodRanked data-applied display"></div>
        </div>
      </section>

      <section class="panel stack">
        <h2>Background Colour</h2>
        <div class="control-grid">
          <label class="field">
            <span>Background colour</span>
            <input id="bgColor" type="text" value="#d6d6d6" />
          </label>
        </div>
      </section>
    </section>

    <section class="logic-column panel stack">
      <h2>PROGRAMMER LOGIC</h2>
      <div id="activeFoodTypeTitle" class="active-food-type">ACTIVE FOOD TYPE: UNKNOWN</div>
      <div id="programmerLogic" class="logic-view" aria-live="polite"></div>
    </section>
  </main>

  <script src="../data/foods-index.js?v=20260724-audio-profiles-v1"></script>
  <script src="../app/default-layout.js?v=20260727-display-builder-v2-default-fallback-v1"></script>
  <script src="../app/display-schema.js?v=20260720-food-type-title-fit-v1"></script>
  <script src="../app/display-name-utils.js?v=20260724-baked-beans-name-fit-v2"></script>
  <script src="./macro-bindings.js?v=20260719-protein-display-policy-v1"></script>
  <script src="./macro-logic-view.js?v=20260722-food-image-manual-v1"></script>
  <script src="./display-builder-v2.js?v=20260727-default-layout-fallback-v1"></script>
</body>
</html>
