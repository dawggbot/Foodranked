<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FoodRanked Layout Builder</title>
  <link rel="stylesheet" href="./layout-builder.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="panel left-panel">
      <header>
        <h1>Layout Builder</h1>
        <div id="layoutStatus" class="status-pill">Repo default loaded</div>
      </header>

      <section class="tool-block">
        <h2>Sections</h2>
        <div id="sectionList" class="section-list"></div>
      </section>

      <section class="tool-block">
        <h2>Layers</h2>
        <div class="row compact">
          <button id="addTextLayer" type="button">Add text</button>
          <button id="duplicateLayer" type="button">Duplicate</button>
          <button id="deleteLayer" type="button">Delete</button>
        </div>
        <label>
          Filter
          <input id="layerFilter" type="search" placeholder="Layer id, label, text" />
        </label>
        <div id="layerList" class="layer-list"></div>
      </section>
    </aside>

    <main class="panel stage-panel">
      <div class="stage-topbar">
        <div>
          <h2 id="sectionTitle">Intro</h2>
          <div id="canvasMeta" class="muted"></div>
        </div>
        <div class="row">
          <label class="inline-check"><input id="showGrid" type="checkbox" checked /> Grid</label>
          <label class="inline-check"><input id="showBounds" type="checkbox" checked /> Bounds</label>
          <label class="inline-check"><input id="showHidden" type="checkbox" /> Hidden</label>
        </div>
      </div>
      <div class="canvas-wrap">
        <div id="canvas" class="canvas" tabindex="0" aria-label="Layout canvas"></div>
      </div>
    </main>

    <aside class="panel right-panel">
      <section class="tool-block">
        <h2>Layer</h2>
        <div id="emptyInspector" class="muted">Select a layer.</div>
        <div id="inspector" class="inspector" hidden>
          <label>
            Label
            <input id="propLabel" type="text" />
          </label>
          <label id="textValueWrap">
            Text
            <input id="propText" type="text" />
          </label>
          <div class="grid-2">
            <label>X <input id="propX" type="number" step="1" /></label>
            <label>Y <input id="propY" type="number" step="1" /></label>
            <label>W <input id="propWidth" type="number" step="1" min="1" /></label>
            <label>H <input id="propHeight" type="number" step="1" min="1" /></label>
            <label>Z <input id="propZ" type="number" step="1" /></label>
            <label>Font <input id="propFontSize" type="number" step="0.5" min="1" /></label>
          </div>
          <div class="grid-2">
            <label>Visible
              <select id="propVisible">
                <option value="true">true</option>
                <option value="false">false</option>
              </select>
            </label>
            <label>Align
              <select id="propAlign">
                <option value="left">left</option>
                <option value="center">center</option>
                <option value="right">right</option>
              </select>
            </label>
          </div>
        </div>
      </section>

      <section id="constraintPanel" class="tool-block" hidden>
        <h2>Bounds</h2>
        <div class="grid-2">
          <label>Min X <input id="minX" type="number" step="1" /></label>
          <label>Max X <input id="maxX" type="number" step="1" /></label>
          <label>Min Y <input id="minY" type="number" step="1" /></label>
          <label>Max Y <input id="maxY" type="number" step="1" /></label>
          <label>Min W <input id="minWidth" type="number" step="1" min="1" /></label>
          <label>Max W <input id="maxWidth" type="number" step="1" min="1" /></label>
          <label>Min H <input id="minHeight" type="number" step="1" min="1" /></label>
          <label>Max H <input id="maxHeight" type="number" step="1" min="1" /></label>
        </div>
        <div class="row compact">
          <button id="fitBoundsToCanvas" type="button">Canvas bounds</button>
          <button id="lockBoundsToLayer" type="button">Lock bounds</button>
          <button id="clearBounds" type="button">Clear</button>
        </div>
      </section>

      <section class="tool-block">
        <h2>Universal Layout</h2>
        <div class="row compact">
          <button id="saveLocal" type="button">Save local</button>
          <button id="saveDisplayBuilder" type="button">Use in display builder</button>
        </div>
        <div class="row compact">
          <button id="resetFromRepo" type="button">Reset</button>
          <button id="copyJson" type="button">Copy JSON</button>
        </div>
        <label>
          Layout JSON
          <textarea id="layoutJson" spellcheck="false"></textarea>
        </label>
        <button id="applyJson" type="button">Apply JSON</button>
      </section>
    </aside>
  </div>

  <script src="../app/default-layout.js"></script>
  <script src="./layout-builder.js"></script>
</body>
</html>
